name: CD

on:
    workflow_call:

jobs:
    Deploy:
        runs-on: self-hosted
        steps:
            - name: Clone Code
              uses: actions/checkout@v7

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            
            - name: Docker Pull Images
              run: docker pull ${{vars.DOCKERHUB_USERNAME}}/ci:latest

            - name: Deploy Nginx Container on server
              run: |
                   docker rm -f web
                   docker run --name web -itd -p 9999:80 ${{vars.DOCKERHUB_USERNAME}}/ci:latest

